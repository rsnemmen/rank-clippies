name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - "rank_models.py"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "rank_models.py"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy pandas pytest ruff

      - name: Run validation
        run: make validate
